name: Release

on:
  push:
    branches:
      - main
      - v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Prevent a newer push from interrupting an active release

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Required so the token used below (not the default GITHUB_TOKEN) is
          # what pushes to the release branch, otherwise pushes from this workflow
          # won't trigger further workflow runs.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run changeset-version
          # A personal access token, not the default GITHUB_TOKEN, so pushes to
          # the release branch trigger this workflow again.
          github-token: ${{ secrets.CHANGESET_GITHUB_TOKEN }}

      # Publish ourselves instead of via the `publish` input above: changesets/action's
      # combined publish + GitHub Releases path errors on this repo (ENOENT on an
      # internal .changeset/pre/*.md bookkeeping file it expects but never creates).
      # This is the "Custom Publishing" pattern from the action's own README.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run changeset-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
